name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen ldid && xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild -project iTaleem.xcodeproj -scheme iTaleem -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # An unsigned build carries no entitlements, so the App Group would be lost. ldid stamps them into
      # the binaries so Impactor can read them and register the group when it signs.
      - name: Embed entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/iTaleem.app
          ldid -SEntitlements/iTaleem.entitlements "$APP/iTaleem"
          ldid -SEntitlements/AttendanceWidget.entitlements "$APP/PlugIns/AttendanceWidget.appex/AttendanceWidget"
          ls -R "$APP/PlugIns" | head -20
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/iTaleem.app Payload/
          zip -qry iTaleem.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iTaleem-ipa
          path: iTaleem.ipa
