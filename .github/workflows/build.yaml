name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen ldid && xcodegen
      - name: Build (unsigned)
        run: |
          xcodebuild -project iTaleem.xcodeproj -scheme iTaleem -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # An unsigned build carries no entitlements, so the App Group would be lost. ldid stamps them into
      # the binaries so Impactor can read them and register the group when it signs.
      - name: Embed entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/iTaleem.app
          echo "--- app bundle ---"; ls "$APP"
          echo "--- plugins ---"; ls "$APP/PlugIns" || true
          cat > ent.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.com.afiq.italeem</string></array>
          </dict></plist>
          EOF
          test -f "$APP/iTaleem" || { echo "MISSING: $APP/iTaleem"; exit 1; }
          ldid -Sent.plist "$APP/iTaleem"
          WIDGET="$APP/PlugIns/AttendanceWidget.appex/AttendanceWidget"
          test -f "$WIDGET" || { echo "MISSING: $WIDGET (the widget was not built - is the new project.yml in the repo?)"; exit 1; }
          ldid -Sent.plist "$WIDGET"
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/iTaleem.app Payload/
          zip -qry iTaleem.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: iTaleem-ipa
          path: iTaleem.ipa
