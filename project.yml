name: iTaleem
options:
  bundleIdPrefix: com.afiq
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iTaleem:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: AttendanceWidget
    entitlements:
      path: Entitlements/iTaleem.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.afiq.italeem
    info:
      path: Plists/iTaleem-Info.plist
      properties:
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - italeem.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afiq.italeem
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Dark AppIcon-Light AppIcon-Terminal"   # one icon per theme
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "iTa'leem"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  AttendanceWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Entitlements/AttendanceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.afiq.italeem
    info:
      path: Plists/AttendanceWidget-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Attendance
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afiq.italeem.AttendanceWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
